[build]
# Use npm install (not npm ci) to avoid EBUSY on node_modules/.cache during Railpack builds
buildCommand = "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader && npm install && npm run build"

[deploy]
preDeployCommand = "chmod +x ./railway/init-app.sh && ./railway/init-app.sh"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
